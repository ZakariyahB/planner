name = "planner-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_EMAIL = "bello.zakariyah20@gmail.com"
# Must equal the Web client ID in Google Cloud; the ID token's `aud` is checked against it.
GOOGLE_WEB_CLIENT_ID = "REPLACE_WITH_WEB_CLIENT_ID"
MONTHLY_CAP_GBP = "15"
# Optional: override the models (defaults: claude-sonnet-5-5 for chat and replans, claude-haiku-5-5 for scheduled runs).
# MODEL_CHAT = "claude-sonnet-5-5"
# MODEL_SCHEDULED = "claude-haiku-5-5"
# The v2 app names its model (X-Planner-Model); only models priced in src/pricing.ts or set above are accepted.
# Server-side refusal fallback is on for claude-sonnet-5-5 and claude-opus-5-5; set DISABLE_FALLBACKS = "1" to turn it off.

# Create with: wrangler kv namespace create USAGE, then paste the id here.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (not stored here): wrangler secret put ANTHROPIC_API_KEY
