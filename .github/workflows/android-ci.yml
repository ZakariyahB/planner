name: android-ci
on:
  push:
    paths: ["android/**", "docs/prompts/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", "docs/prompts/**", ".github/workflows/android-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:scheduler:test :engine:test :calendar:test :assistant:test :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
