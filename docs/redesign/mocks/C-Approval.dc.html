<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approval sheet, rhythm direction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C4A}a:hover{color:#08302F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8C8478; font-family: 'DM Sans', system-ui, sans-serif; color: #1F1B16; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 22px; right: 22px; top: 40px; display: flex; flex-direction: column; gap: 6px; opacity: 0.5; color: #F4EFE6">
    <span style="font-size: 13px">Tuesday 3 November</span>
    <span style="font-family: Fraunces, serif; font-size: 36px">Before Dhuhr</span>
  </div>

  <section role="dialog" aria-label="Review change" style="background: #F4EFE6; border-radius: 28px 28px 0 0; padding: 10px 22px 28px; display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9BFAE"></span>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #6B5F50; font-weight: 500">From your check-in · 12:45</span>
      <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 400; font-size: 30px; line-height: 1.1">30 more minutes on PintOS</h1>
      <span style="font-size: 14px; color: #6B5F50; line-height: 1.45">Only one block changes. Lecture - SDE still starts at 14:00, and Asr is untouched.</span>
    </div>

    <div style="background: #FFFDF8; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 #E3DACB">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 700; color: #0F4C4A; letter-spacing: 0.04em">EDIT · ACADEMIC</span>
        <span style="font-size: 12px; color: #6B5F50">this event only</span>
      </div>
      <span style="font-family: Fraunces, serif; font-size: 22px">PintOS</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11px; color: #6B5F50">Before</span>
          <div style="height: 10px; border-radius: 5px; background: #E3DACB; position: relative"><span style="position: absolute; left: 0; width: 80%; top: 0; bottom: 0; background: #A79C8A; border-radius: 5px"></span></div>
          <span style="font-size: 14px; color: #6B5F50">09:30 – 12:45</span>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1B16" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11px; color: #6B5F50">After</span>
          <div style="height: 10px; border-radius: 5px; background: #E3DACB; position: relative"><span style="position: absolute; left: 0; width: 92%; top: 0; bottom: 0; background: #0F4C4A; border-radius: 5px"></span></div>
          <span style="font-size: 14px; font-weight: 700">09:30 – 13:15</span>
        </div>
      </div>
      <span style="font-size: 13px; color: #6B5F50">Task: 3h30. Includes 15 min for Dhuhr.</span>
    </div>

    <div style="display: flex; gap: 10px">
      <button style="height: 54px; padding: 0 22px; border-radius: 27px; border: 1px solid #C9BFAE; background: transparent; color: #1F1B16; font: 500 15px 'DM Sans', sans-serif">Not now</button>
      <button style="flex: 1; height: 54px; border-radius: 27px; border: none; background: #0F4C4A; color: #F4EFE6; font: 700 15px 'DM Sans', sans-serif">Approve and update Google</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
