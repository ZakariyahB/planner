<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backlog, ink direction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#EFFFB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E10; font-family: 'Space Grotesk', system-ui, sans-serif; color: #EDEDED; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="padding: 28px 20px 14px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA; letter-spacing: 0.04em">7 UNSCHEDULED · 2 NEED A LOOK</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Backlog</h1>
    </div>
    <button style="height: 40px; padding: 0 12px; border-radius: 4px; border: 1px solid #3A3A40; background: transparent; color: #EDEDED; font: 500 12px 'JetBrains Mono', monospace">IMPORT W46</button>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column">
    <sc-for list="{{tasks}}" as="k" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid #222226">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <span style="font-size: 16px; font-weight: 500">{{k.title}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1AA">{{k.dur}}</span>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 10px">
          <span style="color: {{k.catColor}}; border: 1px solid {{k.catBorder}}; border-radius: 3px; padding: 3px 6px">{{k.cat}}</span>
          <sc-for list="{{k.chips}}" as="c" hint-placeholder-count="2">
            <span style="color: #EDEDED; background: #222226; border-radius: 3px; padding: 3px 6px">{{c}}</span>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <section aria-label="Needs a look" style="margin: 10px 16px 0; border: 1px dashed #FFB84D; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FFB84D">NEEDS A LOOK · TITLE DID NOT PARSE</span>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">"5. ADA revision sometime"</span><span style="font-size: 12px; color: #A1A1AA">Academic · Thu 12 · no duration</span></span>
      <button style="height: 40px; padding: 0 12px; border-radius: 4px; border: 1px solid #FFB84D; background: transparent; color: #FFB84D; font: 600 12px 'JetBrains Mono', monospace">FIX</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">"kahf"</span><span style="font-size: 12px; color: #A1A1AA">Commute · Fri 13 · not numbered</span></span>
      <button style="height: 40px; padding: 0 12px; border-radius: 4px; border: 1px solid #FFB84D; background: transparent; color: #FFB84D; font: 600 12px 'JetBrains Mono', monospace">FIX</button>
    </div>
  </section>

  <button aria-label="Add task" style="position: absolute; right: 16px; bottom: 88px; width: 60px; height: 60px; border-radius: 6px; border: none; background: #D4FF3A; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #0E0E10; border-top: 1px solid #222226; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em">
    <a href="B-Today.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: #A1A1AA">TODAY</a>
    <a href="B-Week.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: #A1A1AA">WEEK</a>
    <a href="B-Backlog.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: #D4FF3A; border-top: 2px solid #D4FF3A">BACKLOG</a>
    <a href="B-Today.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: #A1A1AA">ASK</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const cat = {
    ACA: ['#93C5FD', '#2D4E7A'], LEC: ['#C4B5FD', '#5B4B8A'], 'Q&A': ['#5EEAD4', '#1F6F68'], PER: ['#D4D4D8', '#52525B'],
  };
  const raw = [
    { title: 'PintOS', dur: '3h', cat: 'ACA', chips: ['TUE 10', 'DUE FRI 13', 'SPLITTABLE'] },
    { title: 'Lecture - OS', dur: '2h', cat: 'LEC', chips: ['THU 12', 'FROM 15:00'] },
    { title: 'Arabic hw', dur: '1h', cat: 'Q&A', chips: ['TUE 10', 'AFTER ASR'] },
    { title: 'Lecture - SDE', dur: '1h', cat: 'LEC', chips: ["FRI'S", 'FROM 14:00'] },
    { title: 'Internship apps', dur: '2h', cat: 'PER', chips: ['SUN 15', 'P2'] },
  ];
  const tasks = raw.map((k) => ({ ...k, catColor: cat[k.cat][0], catBorder: cat[k.cat][1] }));
  return { tasks };
}
}
</script>
</body>
</html>
